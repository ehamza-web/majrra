<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تحدي اللهجة المحلية</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .container {
    background: #fff;
    border-radius: 20px;
    max-width: 600px;
    width: 100%;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    overflow: hidden;
  }
  .header {
    background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
    color: #fff;
    padding: 30px;
    text-align: center;
  }
  .header h1 { font-size: 28px; margin-bottom: 8px; }
  .header p { font-size: 14px; opacity: 0.9; }
  .progress-bar {
    height: 6px;
    background: #eee;
  }
  .progress-fill {
    height: 100%;
    background: #ff6b6b;
    transition: width 0.3s;
    width: 20%;
  }
  .quiz-body { padding: 30px; }
  .question-count {
    color: #888;
    font-size: 14px;
    margin-bottom: 10px;
  }
  .prompt {
    font-size: 24px;
    font-weight: bold;
    color: #1e3c72;
    margin-bottom: 25px;
    text-align: center;
    background: #f5f7fa;
    padding: 20px;
    border-radius: 12px;
  }
  .options { display: flex; flex-direction: column; gap: 12px; }
  .option {
    padding: 16px 20px;
    border: 2px solid #e0e0e0;
    border-radius: 12px;
    cursor: pointer;
    font-size: 16px;
    transition: all 0.2s;
    background: #fff;
  }
  .option:hover { border-color: #ff6b6b; background: #fff5f5; }
  .option.correct { background: #d4f8e8; border-color: #2ecc71; color: #1a7a4c; font-weight: bold; }
  .option.wrong { background: #fde2e2; border-color: #e74c3c; color: #a83232; }
  .option.disabled { pointer-events: none; }
  .option.removed {
    text-decoration: line-through;
    opacity: 0.5;
    background: #eee;
    color: #999;
    pointer-events: none;
    border-color: #ddd;
    position: relative;
    animation: fadeOutOption 0.4s ease-out;
  }
  .option.removed::after {
    content: '🙈';
    font-size: 20px;
    margin-inline-start: 8px;
    text-decoration: none;
    display: inline-block;
    animation: popEmoji 0.4s ease-out;
  }
  @keyframes fadeOutOption {
    0% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(0.97); }
    100% { opacity: 0.5; transform: scale(1); }
  }
  @keyframes popEmoji {
    0% { transform: scale(0) rotate(-15deg); opacity: 0; }
    60% { transform: scale(1.3) rotate(8deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  .lifeline-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 20px;
    border: 2px solid #6c5ce7;
    border-radius: 30px;
    background: #f5f3ff;
    color: #6c5ce7;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 16px;
    transition: all 0.2s;
  }
  .lifeline-btn:hover:not(:disabled) { background: #6c5ce7; color: #fff; }
  .lifeline-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .explanation {
    margin-top: 20px;
    padding: 15px;
    background: #eef4ff;
    border-radius: 10px;
    font-size: 14px;
    color: #333;
    display: none;
  }
  .nav {
    display: flex;
    justify-content: space-between;
    margin-top: 25px;
  }
  button.nav-btn {
    padding: 12px 28px;
    border: none;
    border-radius: 10px;
    background: #1e3c72;
    color: #fff;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.2s;
  }
  button.nav-btn:disabled { background: #ccc; cursor: not-allowed; }
  button.nav-btn:hover:not(:disabled) { background: #2a5298; }
  .result-screen { text-align: center; padding: 20px; }
  .result-screen h2 { font-size: 32px; color: #1e3c72; margin-bottom: 15px; }
  .result-screen p { font-size: 18px; color: #555; margin-bottom: 25px; }
  .score-circle {
    width: 140px; height: 140px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
    color: #fff;
    font-size: 36px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 25px;
  }
  .restart-btn {
    padding: 14px 32px;
    border: none;
    border-radius: 10px;
    background: #1e3c72;
    color: #fff;
    font-size: 16px;
    cursor: pointer;
  }
  .farewell-text {
    margin-top: 10px;
    font-size: 16px;
    color: #1e3c72;
    font-weight: 600;
    line-height: 1.6;
  }
  .hidden { display: none; }
  .reaction {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    z-index: 999;
    pointer-events: none;
    animation: popReaction 2.2s ease-out forwards;
    text-align: center;
  }
  .reaction .emoji {
    font-size: 100px;
    display: block;
    line-height: 1;
  }
  .reaction .label {
    display: block;
    font-size: 32px;
    font-weight: bold;
    margin-top: 8px;
    padding: 6px 22px;
    border-radius: 30px;
    white-space: nowrap;
  }
  .reaction.correct-reaction .label {
    background: #2ecc71;
    color: #fff;
  }
  .reaction.wrong-reaction .label {
    background: #e74c3c;
    color: #fff;
  }
  @keyframes popReaction {
    0% { transform: translate(-50%, -50%) scale(0) rotate(0deg); opacity: 0; }
    20% { transform: translate(-50%, -50%) scale(1.3) rotate(-8deg); opacity: 1; }
    35% { transform: translate(-50%, -50%) scale(1) rotate(8deg); opacity: 1; }
    80% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
    100% { transform: translate(-50%, -60%) scale(0.85) rotate(0deg); opacity: 0; }
  }
  .shake { animation: shakeIt 0.5s; }
  @keyframes shakeIt {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-10px); }
    40% { transform: translateX(10px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }
  .pulse-green { animation: pulseGreen 0.6s; }
  @keyframes pulseGreen {
    0% { transform: scale(1); }
    40% { transform: scale(1.04); }
    100% { transform: scale(1); }
  }
  .confetti-piece {
    position: fixed;
    top: -20px;
    font-size: 22px;
    z-index: 998;
    pointer-events: none;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(105vh) rotate(360deg); opacity: 0.8; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🗣️ تحدي اللهجة المحلية</h1>
    <p>اختبروا معلوماتكم بمعاني كلمات وتعابير من اللهجة المحلية في محافظة السويداء - سوريا</p>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="quiz-body">
    <div id="quizScreen">
      <div class="question-count" id="questionCount">السؤال 1 من 5</div>
      <div class="prompt" id="prompt"></div>
      <button class="lifeline-btn" id="lifelineBtn" onclick="useLifeline()">🚫 حذف إجابة</button>
      <div class="options" id="options"></div>
      <div class="explanation" id="explanation"></div>
      <div class="nav">
        <button class="nav-btn" id="nextBtn" disabled>التالي</button>
        <div></div>
      </div>
    </div>
    <div id="resultScreen" class="result-screen hidden">
      <div class="score-circle" id="scoreCircle"></div>
      <h2>انتهى التحدي! 🎉</h2>
      <p id="resultText"></p>
      <p class="farewell-text">شكراً لمشاركتكم، ونتمنى لكم دوام التألق باللهجة المحلية! 🌿✨</p>
    </div>
  </div>
</div>

<script>
const questions = [
  {
    prompt: "هرعو غاد: ماذا تعني؟",
    options: ["أهلا وسهلا", "إلى اللقاء", "في السنة القادمة", "إنه هناك في مكان قريب"],
    correct: 3,
    explanation: "تُستخدم هذه العبارة للإشارة إلى شيء أو شخص موجود في مكان قريب."
  },
  {
    prompt: "كفكير: ماذا تعني؟",
    options: ["مكان لبيع الأدوات المنزلية", "أكلة شعبية", "ملعقة كبيرة لسكب السوائل", "طنجرة صغيرة الحجم"],
    correct: 2,
    explanation: "الكفكير هو أداة مطبخ تقليدية تُستخدم لسكب المرق أو السوائل."
  },
  {
    prompt: "قلشين: ماذا تعني؟",
    options: ["كمية قليلة من شيء ما", "وصفة حلويات", "كنزة نصف كم", "الجوارب"],
    correct: 3,
    explanation: "قلشين تعني الجرابات التي تُلبس في القدم."
  },
  {
    prompt: "هشك بشك: ماذا تعني؟",
    options: ["عمل ما بجودة سيئة", "التعبير عن تطابق/التشابه", "التعبير عن الغضب", "التعبير عن الفرح"],
    correct: 0,
    explanation: "تُستخدم هذه العبارة لوصف عمل تم إنجازه بشكل سريع وغير متقن."
  },
  {
    prompt: "سدح مدح: ماذا تعني؟",
    options: ["مكان واسع", "الانزعاج", "شخص طويل القامة", "شخص قصير القامة"],
    correct: 0,
    explanation: "تُستخدم هذه العبارة للتعبير عن مكان واسع ومفتوح."
  },
  {
    prompt: "زقزوق: ماذا تعني؟",
    options: ["شخص صوته رفيع", "طريق ضيق", "طفل صغير", "شخص طويل"],
    correct: 1,
    explanation: "زقزوق تُستخدم للإشارة إلى طريق أو ممر ضيق."
  },
  {
    prompt: "جمشة: ماذا تعني؟",
    options: ["فتاة جميلة", "حجر صغير", "وصفة طعام", "كلام لطيف"],
    correct: 1,
    explanation: "جمشة تعني حجراً صغيراً."
  }
];

let current = 0;
let score = 0;
let answered = false;

function renderQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById('questionCount').textContent = `السؤال ${current + 1} من ${questions.length}`;
  document.getElementById('prompt').textContent = q.prompt;
  document.getElementById('progressFill').style.width = `${((current) / questions.length) * 100}%`;
  const optionsDiv = document.getElementById('options');
  optionsDiv.innerHTML = '';
  q.options.forEach((opt, i) => {
    const div = document.createElement('div');
    div.className = 'option';
    div.textContent = opt;
    div.onclick = () => selectOption(i);
    optionsDiv.appendChild(div);
  });
  document.getElementById('explanation').style.display = 'none';
  document.getElementById('explanation').textContent = '';
  document.getElementById('nextBtn').disabled = true;
  document.getElementById('nextBtn').textContent = current === questions.length - 1 ? 'عرض النتيجة' : 'التالي';
  document.getElementById('lifelineBtn').disabled = false;
}

const correctEmojis = ['🎉', '🥳', '🔥', '👏', '⭐', '💪', '✅'];
const wrongEmojis = ['😂', '🤣', '😅', '🙈', '😬', '🫠'];

function pickRandom(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function showReaction(emoji, isCorrect) {
  const div = document.createElement('div');
  div.className = 'reaction ' + (isCorrect ? 'correct-reaction' : 'wrong-reaction');
  div.innerHTML = `
    <span class="emoji">${emoji}</span>
    <span class="label">${isCorrect ? 'صح! ✔️' : 'خطأ! ✖️'}</span>
  `;
  document.body.appendChild(div);
  setTimeout(() => div.remove(), 2200);
}

function showConfetti() {
  const emojis = ['🎉', '🎊', '⭐', '✨', '🥳'];
  for (let i = 0; i < 18; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.textContent = pickRandom(emojis);
    piece.style.left = Math.random() * 100 + 'vw';
    piece.style.animationDuration = (1.5 + Math.random() * 1.2) + 's';
    piece.style.fontSize = (16 + Math.random() * 16) + 'px';
    document.body.appendChild(piece);
    setTimeout(() => piece.remove(), 3000);
  }
}

function useLifeline() {
  if (answered) return;
  const q = questions[current];
  const opts = document.querySelectorAll('.option');
  const availableWrongIndexes = [];
  opts.forEach((el, idx) => {
    if (idx !== q.correct && !el.classList.contains('removed')) {
      availableWrongIndexes.push(idx);
    }
  });
  if (availableWrongIndexes.length === 0) {
    document.getElementById('lifelineBtn').disabled = true;
    return;
  }
  const chosenIdx = availableWrongIndexes[Math.floor(Math.random() * availableWrongIndexes.length)];
  opts[chosenIdx].classList.add('removed');
  document.getElementById('lifelineBtn').disabled = true;
}

function selectOption(i) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const opts = document.querySelectorAll('.option');
  const container = document.querySelector('.container');
  const isCorrect = i === q.correct;

  opts.forEach((el, idx) => {
    el.classList.add('disabled');
    if (idx === q.correct) el.classList.add('correct');
    else if (idx === i) el.classList.add('wrong');
  });

  if (isCorrect) {
    score++;
    showReaction(pickRandom(correctEmojis), true);
    showConfetti();
    container.classList.add('pulse-green');
    setTimeout(() => container.classList.remove('pulse-green'), 600);
  } else {
    showReaction(pickRandom(wrongEmojis), false);
    container.classList.add('shake');
    setTimeout(() => container.classList.remove('shake'), 500);
  }

  const expDiv = document.getElementById('explanation');
  expDiv.textContent = q.explanation;
  expDiv.style.display = 'block';
  setTimeout(() => {
    document.getElementById('nextBtn').disabled = false;
  }, 1200);
}

document.getElementById('nextBtn').onclick = () => {
  current++;
  if (current >= questions.length) {
    showResult();
  } else {
    renderQuestion();
  }
};

function showResult() {
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('quizScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.remove('hidden');
  document.getElementById('scoreCircle').textContent = `${score}/${questions.length}`;
  let msg = '';
  if (score === questions.length) {
    msg = 'ممتاز! خبير لهجات حقيقي 🏆';
    showConfetti();
    setTimeout(showConfetti, 400);
  } else if (score >= questions.length / 2) {
    msg = 'أداء جيد! استمر بالتعلم 🙂';
  } else {
    msg = 'لا بأس، جرب مرة أخرى وتعلم الكلمات الجديدة! 😅';
  }
  document.getElementById('resultText').textContent = `${msg} (${score} من ${questions.length} إجابات صحيحة)`;
}

function restart() {
  current = 0;
  score = 0;
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('quizScreen').classList.remove('hidden');
  renderQuestion();
}

renderQuestion();
</script>
</body>
</html>
