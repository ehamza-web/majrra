  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

        <div style=\"max-width:900px;margin:0 auto 32px;border-radius:20px;overflow:hidden;box-shadow:0 12px 32px rgba(0,0,0,.14)\">\n          <img src=\"a21f10e3-3442-4b30-97e3-188f9b6b996d\" alt=\"اشتراك مجرة لسوريا\" style=\"width:100%;display:block\">\n        <\u002Fdiv>\n        <div style=\"border-radius:28px;overflow:hidden;position:relative;background:linear-gradient(135deg,#1a1530 0%,#2b1f52 55%,#422789 100%);padding:44px 36px;margin-bottom:36px\">\n          <div style=\"position:absolute;top:-60px;left:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(124,92,255,.45),transparent 70%);pointer-events:none\"><\u002Fdiv>\n          <div style=\"position:absolute;bottom:-80px;right:-40px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(227,30,36,.25),transparent 70%);pointer-events:none\"><\u002Fdiv>\n          <div style=\"display:flex;gap:36px;flex-wrap:wrap;align-items:center;justify-content:center;position:relative\">\n            <div style=\"flex:1 1 260px;max-width:300px;filter:drop-shadow(0 20px 40px rgba(0,0,0,.45))\">\n              <image-slot id=\"majarra-app-visual\" shape=\"rect\" src=\"https://my.majarra.com/_nuxt/img/MockupDownloadApp.6381fe4.webp\" fit=\"contain\" placeholder=\"واجهة تطبيق مجرة\" style=\"width:100%;aspect-ratio:1/1;background:transparent\"><\u002Fimage-slot>\n            <\u002Fdiv>\n            <div style=\"flex:2 1 340px;max-width:480px;text-align:right\">\n              <div style=\"display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);padding:7px 14px;border-radius:100px;margin-bottom:16px\">\n                <span style=\"width:7px;height:7px;border-radius:50%;background:#4ADE80\"><\u002Fspan>\n                <span style=\"font:700 12px 'Cairo';color:#fff\">جديد — مجرة تصل رسمياً إلى سوريا<\u002Fspan>\n              <\u002Fdiv>\n              <h2 style=\"font:800 32px/1.35 'Cairo';color:#fff;margin:0 0 12px\">أفضل محتوى عربي، بين يديك الآن<\u002Fh2>\n              <p style=\"font:400 15px/1.8 'Cairo';color:#cfcbe6;margin:0 0 22px\">فرصة محدودة لمشتركي سوريا للانضمام إلى مجرة بسعر خاص، وبأسهل طريقة دفع محلية.<\u002Fp>\n              <div style=\"display:flex;flex-wrap:wrap;gap:10px\">\n                <div style=\"display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);padding:8px 14px;border-radius:100px;font:600 12px 'Cairo';color:#e8e6f5\">بدون بطاقة ائتمانية دولية<\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);padding:8px 14px;border-radius:100px;font:600 12px 'Cairo';color:#e8e6f5\">إلغاء في أي وقت<\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);padding:8px 14px;border-radius:100px;font:600 12px 'Cairo';color:#e8e6f5\">محتوى جديد يومياً<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"max-width:480px;margin:0 auto;position:relative\">\n          <div style=\"position:absolute;top:-14px;left:28px;background:#E31E24;color:#fff;font:700 11px 'Cairo';padding:6px 14px;border-radius:100px;box-shadow:0 4px 12px rgba(227,30,36,.35);z-index:2\">توفير 50% · الأكثر شعبية<\u002Fdiv>\n          <div style=\"background:#fff;border-radius:24px;padding:38px 32px 32px;box-shadow:0 12px 36px rgba(20,10,50,.1);text-align:right\">\n            <div style=\"display:flex;justify-content:center;margin-bottom:26px\">\n              <div style=\"display:flex;background:#F4F2FC;border-radius:100px;padding:5px;gap:4px\">\n                <button style=\"{{ majarraToggleMonthlyStyle }}\" onclick=\"{{ setMajarraMonthly }}\">اشتراك شهري<\u002Fbutton>\n                <button style=\"{{ majarraToggleYearlyStyle }}\" onclick=\"{{ setMajarraYearly }}\">اشتراك سنوي<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <h3 style=\"font:800 19px 'Cairo';color:#161616;margin:0 0 6px\">{{ majarraPlanTitle }}<\u002Fh3>\n            <p style=\"font:400 13px/1.6 'Cairo';color:#8a8a8a;margin:0 0 18px\">تصفح لا محدود من كامل منصات مجرة<\u002Fp>\n            <div style=\"display:flex;align-items:baseline;gap:10px;margin-bottom:24px\">\n              <span style=\"font:800 30px 'Cairo';color:#161616\">{{ majarraPrice }}<\u002Fspan>\n              <sc-if value=\"{{ isMajarraYearly }}\" hint-placeholder-val=\"{{ true }}\">\n                <span style=\"font:600 14px 'Cairo';color:#b5b5b5;text-decoration:line-through\">{{ majarraOldPrice }}<\u002Fspan>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:16px;margin-bottom:26px\">\n              <div style=\"display:flex;gap:12px;align-items:flex-start\"><span style=\"flex:none;width:22px;height:22px;border-radius:50%;background:#6C5CE7;color:#fff;display:flex;align-items:center;justify-content:center;font:700 12px 'Cairo'\">✓<\u002Fspan><span style=\"font:400 14px/1.6 'Cairo';color:#3c3c3c\">كل محتوى مجرة بين يديك في تطبيق واحد: بما في ذلك هارفارد بزنس ريفيو وغيرها.<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;gap:12px;align-items:flex-start\"><span style=\"flex:none;width:22px;height:22px;border-radius:50%;background:#6C5CE7;color:#fff;display:flex;align-items:center;justify-content:center;font:700 12px 'Cairo'\">✓<\u002Fspan><span style=\"font:400 14px/1.6 'Cairo';color:#3c3c3c\">آخر تطورات الإدارة والعلوم والتكنولوجيا من مصادر موثوقة وحديثة.<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;gap:12px;align-items:flex-start\"><span style=\"flex:none;width:22px;height:22px;border-radius:50%;background:#6C5CE7;color:#fff;display:flex;align-items:center;justify-content:center;font:700 12px 'Cairo'\">✓<\u002Fspan><span style=\"font:400 14px/1.6 'Cairo';color:#3c3c3c\">أرشيف واسع مع تحديث مستمر وإضافة محتوى جديد يومياً مع فيديو ومواد صوتية.<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;gap:12px;align-items:flex-start\"><span style=\"flex:none;width:22px;height:22px;border-radius:50%;background:#6C5CE7;color:#fff;display:flex;align-items:center;justify-content:center;font:700 12px 'Cairo'\">✓<\u002Fspan><span style=\"font:400 14px/1.6 'Cairo';color:#3c3c3c\">تصفح في أي مكان وأي وقت، كل يوم أو كل أسبوع أو كل شهر حسب رغبتك.<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <button style=\"width:100%;background:linear-gradient(135deg,#161616,#2b2b2b);color:#fff;border:none;border-radius:14px;padding:17px;font:700 16px 'Cairo';cursor:pointer;box-shadow:0 10px 24px rgba(0,0,0,.18)\" onclick=\"{{ openMajarraModal }}\">انضم الآن — كن من الأوائل في سوريا<\u002Fbutton>\n            <p style=\"font:400 11px 'Cairo';color:#a5a5a5;margin:14px 0 0;text-align:center\">دفع سهل عبر شام كاش · تأكيد فوري عبر واتساب<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ===================== FANN AL QIYADA ===================== -->\n    <sc-if value=\"{{ isFann }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"animation:fadeIn .3s ease\">\n        <div style=\"border-radius:28px;overflow:hidden;position:relative;background:linear-gradient(135deg,#0f0f16 0%,#1c1a2e 55%,#3a2a5e 100%);padding:44px 36px;margin-bottom:36px\">\n          <div style=\"position:absolute;top:-60px;left:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(124,92,255,.4),transparent 70%);pointer-events:none\"><\u002Fdiv>\n          <div style=\"position:absolute;bottom:-80px;right:-40px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(245,180,0,.2),transparent 70%);pointer-events:none\"><\u002Fdiv>\n          <div style=\"display:flex;gap:36px;flex-wrap:wrap;align-items:center;justify-content:center;position:relative\">\n            <div style=\"flex:1 1 240px;max-width:280px;filter:drop-shadow(0 20px 40px rgba(0,0,0,.45))\">\n              <img src=\"https://my.majarra.com/_nuxt/img/leadership-mockup.9957569.png\" alt=\"فن القيادة\" style=\"width:100%;height:auto;display:block;border-radius:16px\">\n            <\u002Fdiv>\n            <div style=\"flex:2 1 340px;max-width:480px;text-align:right\">\n              <div style=\"display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);padding:7px 14px;border-radius:100px;margin-bottom:16px\">\n                <span style=\"width:7px;height:7px;border-radius:50%;background:#F5B400\"><\u002Fspan>\n                <span style=\"font:700 12px 'Cairo';color:#fff\">تجربة تعلّم متكاملة عبر تطبيق مجرة<\u002Fspan>\n              <\u002Fdiv>\n              <h2 style=\"font:800 30px/1.35 'Cairo';color:#fff;margin:0 0 12px\">قائد اليوم يبدأ صباحه بفكرة<\u002Fh2>\n              <p style=\"font:400 15px/1.8 'Cairo';color:#c9c6da;margin:0 0 22px\">إلهام يومي مكثّف من أحدث أبحاث وتجارب القيادة العالمية، بصوت ونص يواكب مشاغلك اليومية.<\u002Fp>\n              <div style=\"display:flex;flex-wrap:wrap;gap:10px\">\n                <div style=\"display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);padding:8px 14px;border-radius:100px;font:600 12px 'Cairo';color:#e8e6f5\">محتوى صوتي ونصي يومي<\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);padding:8px 14px;border-radius:100px;font:600 12px 'Cairo';color:#e8e6f5\">تحديث يومي<\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);padding:8px 14px;border-radius:100px;font:600 12px 'Cairo';color:#e8e6f5\">إلغاء في أي وقت<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start;justify-content:center\">\n\n          <div style=\"flex:1 1 380px;max-width:520px;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.05)\">\n            <div style=\"padding:20px 26px;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap\">\n              <span style=\"font:800 20px 'Cairo';color:#1c1a2e\">فن القيادة<\u002Fspan>\n              <span style=\"font:600 11px 'Cairo';color:#6C5CE7;background:#F4F2FC;padding:6px 12px;border-radius:100px\">نموذج عمّا يصلك يومياً بالإيميل وإشعار الموبايل<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"padding:26px\">\n              <h4 style=\"font:800 15px 'Cairo';color:#1c1a2e;margin:0 0 16px;text-align:right\">فكرة اليوم – النوم الكافي ضروري للقيادة الفعالة<\u002Fh4>\n              <div style=\"position:relative;background:#F4F2FC;border-radius:16px;padding:38px 34px\">\n                <span style=\"position:absolute;top:12px;left:14px;width:28px;height:28px;border-radius:50%;background:#6C5CE7;color:#fff;display:flex;align-items:center;justify-content:center;font:700 18px/1 Georgia,serif;padding-top:3px\">\"<\u002Fspan>\n                <p style=\"font:700 16px/1.85 'Cairo';color:#1c1a2e;margin:0;text-align:right\">عندما لا تحصل على كفايتك من النوم، تتأثر قدرتك على اتخاذ القرار والإبداع، ويزداد احتمال أن ينفد صبرك وتنفعل بسرعة.<\u002Fp>\n                <span style=\"position:absolute;bottom:12px;right:14px;width:28px;height:28px;border-radius:50%;background:#6C5CE7;color:#fff;display:flex;align-items:center;justify-content:center;font:700 18px/1 Georgia,serif;padding-top:3px\">\"<\u002Fspan>\n              <\u002Fdiv>\n              <p style=\"font:400 12px/1.85 'Cairo';color:#8a8a8a;margin:16px 0 0;text-align:right\">يضر إرهاقك بعلاقاتك بالموظفين أيضاً من دون أن تشعر غالباً؛ فتفاعل الموظفين والتزامهم بالأخلاقيات المهنية يضعفان حين يعملون مع قائد محروم من النوم. الخلاصة: عندما لا تمنح نفسك الراحة التي تحتاج إليها، فإن فريقك بأكمله سيدفع الثمن.<\u002Fp>\n              <p style=\"font:600 13px/1.7 'Cairo';color:#6C5CE7;margin:16px 0 0;text-align:right\">كيف تؤثر عادات نومك على فريقك، هل تضرهم أم تعود عليهم بالفائدة؟<\u002Fp>\n              <p style=\"font:400 11px 'Cairo';color:#b5b5b5;margin:14px 0 0;text-align:right\">مقتبسة من مقال <a href=\"https://hbrarabic.com/?p=37258\" target=\"_blank\" style=\"color:#6C5CE7;text-decoration:underline\">\"نم جيّداً لتكون قائداً أفضل\"<\u002Fa> لكريستوفر بارنز<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"flex:1 1 340px;max-width:460px;position:relative\">\n            <div style=\"position:absolute;top:-14px;left:28px;background:#F5B400;color:#161616;font:700 11px 'Cairo';padding:6px 14px;border-radius:100px;box-shadow:0 4px 12px rgba(245,180,0,.35);z-index:2\">اشتراك سنوي<\u002Fdiv>\n            <div style=\"background:#fff;border-radius:24px;padding:38px 32px 32px;box-shadow:0 12px 36px rgba(20,10,50,.1);text-align:right\">\n              <h3 style=\"font:800 19px 'Cairo';color:#161616;margin:0 0 6px\">اشتراك فن القيادة<\u002Fh3>\n              <p style=\"font:400 13px/1.6 'Cairo';color:#8a8a8a;margin:0 0 18px\">إلهام قيادي يومي بين يديك<\u002Fp>\n              <div style=\"display:flex;align-items:baseline;gap:10px;margin-bottom:24px\">\n                <span style=\"font:800 30px 'Cairo';color:#161616\">270,000 ل.س<\u002Fspan>\n                <span style=\"font:600 13px 'Cairo';color:#8a8a8a\">/ سنوياً<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:16px;margin-bottom:26px\">\n                <div style=\"display:flex;gap:12px;align-items:flex-start\"><span style=\"flex:none;width:22px;height:22px;border-radius:50%;background:#6C5CE7;color:#fff;display:flex;align-items:center;justify-content:center;font:700 12px 'Cairo'\">✓<\u002Fspan><span style=\"font:400 14px/1.6 'Cairo';color:#3c3c3c\">إلهام يومي من الخبراء: أحدث أبحاث وتجارب القيادة العالمية بين يديك كل صباح.<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;gap:12px;align-items:flex-start\"><span style=\"flex:none;width:22px;height:22px;border-radius:50%;background:#6C5CE7;color:#fff;display:flex;align-items:center;justify-content:center;font:700 12px 'Cairo'\">✓<\u002Fspan><span style=\"font:400 14px/1.6 'Cairo';color:#3c3c3c\">أقصى فائدة في أقل وقت: معلومات مكثفة تلائم زحمة مشاغلك اليومية.<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;gap:12px;align-items:flex-start\"><span style=\"flex:none;width:22px;height:22px;border-radius:50%;background:#6C5CE7;color:#fff;display:flex;align-items:center;justify-content:center;font:700 12px 'Cairo'\">✓<\u002Fspan><span style=\"font:400 14px/1.6 'Cairo';color:#3c3c3c\">معك أينما كنت: متوفرة نصياً وصوتياً عبر الإيميل وتطبيق مجرة.<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n              <button style=\"width:100%;background:linear-gradient(135deg,#1c1a2e,#3a2a5e);color:#fff;border:none;border-radius:14px;padding:17px;font:700 16px 'Cairo';cursor:pointer;box-shadow:0 10px 24px rgba(58,42,94,.3)\" onclick=\"{{ openFannModal }}\">ابدأ رحلتك القيادية الآن<\u002Fbutton>\n              <p style=\"font:400 11px 'Cairo';color:#a5a5a5;margin:14px 0 0;text-align:center\">يمكنك الإلغاء أو إيقاف التجديد التلقائي بسهولة في أي وقت<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ===================== TAFAUL ===================== -->\n    <sc-if value=\"{{ isTafaul }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"animation:fadeIn .3s ease\">\n        <div style=\"border-radius:28px;overflow:hidden;position:relative;background:linear-gradient(135deg,#0f3d24 0%,#1c6b45 55%,#2FAE60 100%);padding:44px 36px;margin-bottom:36px\">\n          <div style=\"position:absolute;top:-60px;right:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 70%);pointer-events:none\"><\u002Fdiv>\n          <div style=\"posit nclick=\"{{ toggleManhomMute }}\" style=\"height:38px;padding:0 14px;border-radius:19px;background:rgba(0,0,0,.55);border:none;color:#fff;font:700 12px 'Cairo';cursor:pointer;display:flex;align-items:center;justify-content:center\">{{ manhomMuteIcon }}<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"max-width:720px;margin:0 auto 40px;background:#161320;border-radius:20px;padding:34px;color:#fff\">\n            <div style=\"display:flex;flex-direction:column;gap:10px;margin-bottom:24px\">\n              <div style=\"background:rgba(255,255,255,.06);border-radius:12px;padding:14px 16px\"><p style=\"font:700 13px 'Cairo';color:#fff;margin:0 0 4px\">حضور خاص في منصات مجرة<\u002Fp><p style=\"font:400 12px/1.6 'Cairo';color:#a5a2b8;margin:0\">مثل مقابلة ضمن هارفارد بزنس ريفيو العربية وإم آي تي تكنولوجي ريفيو العربية وغيرها<\u002Fp><\u002Fdiv>\n              <div style=\"background:rgba(255,255,255,.06);border-radius:12px;padding:14px 16px\"><p style=\"font:700 13px 'Cairo';color:#fff;margin:0 0 4px\">حضور رقمي مميز في منصة \"من هم\"<\u002Fp><p style=\"font:400 12px/1.6 'Cairo';color:#a5a2b8;margin:0\">لترسيخ مكانتك كمرجع في قطاعك، يتضمن ترويج أكبر وقسم خاص للرؤساء التنفيذيين<\u002Fp><\u002Fdiv>\n              <div style=\"background:rgba(255,255,255,.06);border-radius:12px;padding:14px 16px\"><p style=\"font:700 13px 'Cairo';color:#fff;margin:0 0 4px\">سيرة ذاتية احترافية ومؤثرة<\u002Fp><p style=\"font:400 12px/1.6 'Cairo';color:#a5a2b8;margin:0\">سيرة ذاتية مصممة خصيصاً لتعكس مسيرتك بشكل استثنائي<\u002Fp><\u002Fdiv>\n            <\u002Fdiv>\n            <p style=\"font:700 15px 'Cairo';color:#fff;margin:0 0 4px;text-align:center\">قيادتك تصنع الفارق<\u002Fp>\n            <p style=\"font:400 12px 'Cairo';color:#a5a2b8;margin:0 0 20px;text-align:center\">حان الوقت ليرى العالم ذلك — تواصل معنا اليوم لتبدأ صياغة حضورك الرقمي<\u002Fp>\n            <button style=\"width:100%;background:#fff;color:#161320;border:none;border-radius:12px;padding:15px;font:700 15px 'Cairo';cursor:pointer\" onclick=\"{{ openManhomCeoModal }}\">تواصل معنا<\u002Fbutton>\n        <\u002Fdiv>\n\n        <div style=\"overflow-x:auto;-webkit-overflow-scrolling:touch\">\n        <div style=\"display:grid;grid-template-columns:1.6fr repeat(2,1fr);min-width:520px;background:#fff;border:1px solid #ececec;border-radius:16px;overflow:hidden\">\n\n          <div style=\"padding:20px 18px\"><\u002Fdiv>\n          <div style=\"padding:20px 14px;text-align:center;border-right:1px solid #ececec;background:#F5F2FF\">\n            <p style=\"font:700 15px 'Cairo';color:#161616;margin:0 0 8px\">السمعة الرقمية<\u002Fp>\n            <p style=\"font:400 12px/1.5 'Cairo';color:#8a8a8a;margin:0 0 14px;min-height:36px\">لتأسيس سمعة رقمية يقرؤها الذكاء الاصطناعي والباحثون<\u002Fp>\n            <p style=\"font:800 15px 'Cairo';color:#6C5CE7;margin:0 0 2px\">149 دولار / سنوياً<\u002Fp>\n            <p style=\"font:400 11px 'Cairo';color:#9a94b8;margin:0 0 12px\">≈ 2,050,000 ل.س<\u002Fp>\n            <button style=\"width:100%;background:#6C5CE7;color:#fff;border:none;border-radius:10px;padding:10px;font:700 12px 'Cairo';cursor:pointer\" onclick=\"{{ openManhomModalReputation }}\">اشترك سنوياً<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"padding:20px 14px;text-align:center;border-right:1px solid #ececec\">\n            <p style=\"font:700 15px 'Cairo';color:#161616;margin:0 0 8px\">الحضور المؤثر<\u002Fp>\n            <p style=\"font:400 12px/1.5 'Cairo';color:#8a8a8a;margin:0 0 14px;min-height:36px\">حضور موسّع على \"من هم\" والنشرة والشبكات<\u002Fp>\n            <p style=\"font:800 15px 'Cairo';color:#161616;margin:0 0 2px\">300 دولار / سنوياً<\u002Fp>\n            <p style=\"font:400 11px 'Cairo';color:#9a9a9a;margin:0 0 12px\">≈ 4,120,000 ل.س — أو 30$/شهرياً<\u002Fp>\n            <button style=\"width:100%;background:#fff;color:#161616;border:1px solid #161616;border-radius:10px;padding:10px;font:700 12px 'Cairo';cursor:pointer\" onclick=\"{{ openManhomModalInfluential }}\">اشترك سنوياً<\u002Fbutton>\n          <\u002Fdiv>\n          <sc-for list=\"{{ manhomRows }}\" as=\"row\" hint-placeholder-count=\"8\">\n            <div style=\"padding:16px 18px;font:400 13px/1.6 'Cairo';color:#3c3c3c;border-top:1px solid #f2f2f2\">{{ row.name }}<\u002Fdiv>\n            <div style=\"padding:16px 14px;text-align:center;border-top:1px solid #f2f2f2;border-right:1px solid #ececec;background:#F5F2FF;font:400 13px 'Cairo';color:#4a3f8f\">{{ row.reputation }}<\u002Fdiv>\n            <div style=\"padding:16px 14px;text-align:center;border-top:1px solid #f2f2f2;border-right:1px solid #ececec;font:400 13px 'Cairo';color:#6b6b6b\">{{ row.influential }}<\u002Fdiv>\n          <\u002Fsc-for>\n\n        <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n\n  <div style=\"max-width:1040px;width:100%;margin-top:56px;display:flex;flex-wrap:wrap;justify-content:center;gap:14px\">\n    <div style=\"display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #ececec;border-radius:100px;padding:12px 20px\">\n      <img src=\"e30bdc75-dde3-4109-a987-563ac803165e\" alt=\"\" style=\"width:28px;height:28px;border-radius:8px;object-fit:cover\">\n      <span style=\"font:600 13px 'Cairo';color:#3c3c3c\">الدفع بالليرة السورية عبر شام كاش<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #ececec;border-radius:100px;padding:12px 20px\">\n      <img src=\"3172296e-697b-4284-a0af-29a51a80cb5c\" alt=\"\" style=\"width:28px;height:28px;border-radius:8px;object-fit:cover\">\n      <span style=\"font:600 13px 'Cairo';color:#3c3c3c\">تأكيد فوري عبر واتساب<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #ececec;border-radius:100px;padding:12px 20px\">\n      <img src=\"28dfc5da-f5c0-47b4-9a85-1400c65400e0\" alt=\"علم سوريا\" style=\"width:26px;border-radius:2px\">\n      <span style=\"font:600 13px 'Cairo';color:#3c3c3c\">مصمم خصيصاً لمشتركي سوريا<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ===================== MODAL ===================== -->\n  <sc-if value=\"{{ modalOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;background:rgba(20,18,28,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50\" onclick=\"{{ closeModal }}\">\n      <div style=\"background:#fff;border-radius:20px;max-width:440px;width:100%;padding:30px;max-height:90vh;overflow-y:auto\" onclick=\"{{ stopProp }}\">\n\n        <div style=\"display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px\">\n          <div>\n            <p style=\"font:700 12px 'Cairo';color:#6C5CE7;margin:0 0 4px\">{{ modalPlanName }}<\u002Fp>\n            <p style=\"font:800 19px 'Cairo';color:#161616;margin:0\">{{ modalPlanPrice }}<\u002Fp>\n          <\u002Fdiv>\n          <button style=\"background:#f1f0ed;border:none;width:32px;height:32px;border-radius:50%;font:700 15px 'Cairo';color:#161616;cursor:pointer\" onclick=\"{{ closeModal }}\">×<\u002Fbutton>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ modalStepForm }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex;flex-direction:column;gap:14px\">\n            <div>\n              <label style=\"font:600 13px 'Cairo';color:#3c3c3c;display:block;margin-bottom:6px\">الاسم الكامل<\u002Flabel>\n              <input type=\"text\" value=\"{{ formName }}\" oninput=\"{{ onNameChange }}\" placeholder=\"مثال: أحمد الشامي\" style=\"width:100%;border:1px solid #ddd;border-radius:10px;padding:12px;font:400 14px 'Cairo';direction:rtl\">\n            <\u002Fdiv>\n            <div>\n              <label style=\"font:600 13px 'Cairo';color:#3c3c3c;display:block;margin-bottom:6px\">رقم الهاتف / واتساب<\u002Flabel>\n              <input type=\"tel\" value=\"{{ formPhone }}\" oninput=\"{{ onPhoneChange }}\" placeholder=\"09xxxxxxxx\" style=\"width:100%;border:1px solid #ddd;border-radius:10px;padding:12px;font:400 14px 'Cairo';direction:ltr;text-align:right\">\n            <\u002Fdiv>\n            <div>\n              <label style=\"font:600 13px 'Cairo';color:#3c3c3c;display:block;margin-bottom:6px\">البريد الإلكتروني<\u002Flabel>\n              <input type=\"email\" value=\"{{ formEmail }}\" oninput=\"{{ onEmailChange }}\" placeholder=\"name@example.com\" style=\"width:100%;border:1px solid #ddd;border-radius:10px;padding:12px;font:400 14px 'Cairo';direction:ltr;text-align:right\">\n            <\u002Fdiv>\n            <button style=\"width:100%;background:#161616;color:#fff;border:none;border-radius:12px;padding:15px;font:700 15px 'Cairo';cursor:pointer;margin-top:6px;{{ formSubmitDisabledStyle }}\" onclick=\"{{ submitForm }}\">متابعة<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ modalStepPay }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"text-align:center\">\n            <p style=\"font:400 13px/1.7 'Cairo';color:#5c5c5c;margin:0 0 16px\">امسح رمز QR عبر تطبيق شام كاش لإتمام الدفع<\u002Fp>\n            <image-slot id=\"shamcash-qr\" shape=\"rounded\" radius=\"12\" fit=\"contain\" src=\"4957326b-66bb-42a9-abfd-b3d4cf8cde3e\" placeholder=\"QR كود شام كاش\" style=\"width:200px;height:200px;margin:0 auto\"><\u002Fimage-slot>\n            <p style=\"font:400 12px/1.7 'Cairo';color:#9a9a9a;margin:16px 0 20px\">بعد إتمام التسديد، أرسل لنا صورة إشعار التحويل عبر واتساب لتفعيل اشتراكك.<\u002Fp>\n            <a href=\"{{ whatsappLink }}\" target=\"_blank\" style=\"display:block;width:100%;background:#25D366;color:#fff;text-decoration:none;border-radius:12px;padding:15px;font:700 15px 'Cairo'\">أرسلت الإشعار عبر واتساب<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ modalStepContact }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"text-align:center\">\n            <p style=\"font:400 13px/1.7 'Cairo';color:#5c5c5c;margin:0 0 20px\">هذه باقة مخصّصة — سيتواصل معك فريقنا لتحديد التفاصيل والسعر النهائي.<\u002Fp>\n            <a href=\"{{ whatsappLink }}\" target=\"_blank\" style=\"display:block;width:100%;background:#25D366;color:#fff;text-decoration:none;border-radius:12px;padding:15px;font:700 15px 'Cairo'\">تواصل معنا عبر واتساب<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    activeTab: 'majarra',\n    majarraBilling: 'yearly',\n    modalOpen: false,\n    modalPlan: null,\n    modalMode: 'pay',\n    modalStep: 'form',\n    formName: '',\n    formPhone: '',\n    formEmail: '',\n    manhomVideoPlaying: true,\n    manhomVideoMuted: true\n  };\n\n  tabStyle(key) {\n    const active = this.state.activeTab === key;\n    const color = { majarra: '#161616', fann: '#6C5CE7', tafaul: '#2FAE60', manhom: '#6C5CE7' }[key];\n    return `border:none;border-radius:12px;padding:12px 22px;font:700 14px 'Cairo';cursor:pointer;transition:all .15s ease;background:${active ? color : 'transparent'};color:${active ? '#fff' : '#6b6b6b'}`;\n  }\n\n  openModal(planName, price, mode) {\n    this.setState({\n      modalOpen: true, modalPlan: { name: planName, price }, modalMode: mode,\n      modalStep: 'form', formName: '', formPhone: '', formEmail: ''\n    });\n  }\n\n  buildWhatsappLink() {\n    const plan = this.state.modalPlan;\n    const name = this.state.formName || '';\n    const msg = plan && plan.name\n      ? `مرحباً، أرسلت إشعار تسديد اشتراك \"${plan.name}\"${name ? ` باسم ${name}` : ''}.`\n      : 'مرحباً، أرغب بالاستفسار عن باقة الرؤساء التنفيذيين.';\n    return `https://wa.me/963992638993?text=${encodeURIComponent(msg)}`;\n  }\n\n  renderVals() {\n    const s = this.state;\n    const manhomRows = [\n      { name: 'نشر الملف لقراءته من الذكاء الاصطناعي والمستخدمين والباحثين (الاسم والسيرة والجنسية وبلد الإقامة وقنوات التواصل الاجتماعي)', basic: 'نشر خلال 30 يوماً', reputation: 'نشر في اليوم نفسه', influential: 'نشر في اليوم نفسه' },\n      { name: 'إشارة توثيق الملف', basic: 'لا يوجد', reputation: 'إشارة زرقاء', influential: 'إشارة زرقاء' },\n      { name: 'إضافة الصور والفيديو', basic: '✕', reputation: '✓', influential: '✓' },\n      { name: 'إضافة 5 روابط خارجية', basic: '✕', reputation: '✓', influential: '✓' },\n      { name: 'تحديث الملف بمعلومات جديدة', basic: 'التحديث خلال 30 يوماً', reputation: 'التحديث في اليوم نفسه', influential: 'التحديث في اليوم نفسه' },\n      { name: 'إضافة 5 روابط إخبارية', basic: '✕', reputation: '✓', influential: '✓' },\n      { name: 'الظهور ضمن \"شخصية اليوم\" على \"من هم\"', basic: '✕', reputation: '✕', influential: '✓' },\n      { name: 'ترويج خارجي على وسائل تواصل \"من هم\"', basic: '✕', reputation: '✕', influential: '✓' }\n    ];\n\n    return {\n      isMajarra: s.activeTab === 'majarra',\n      isFann: s.activeTab === 'fann',\n      isTafaul: s.activeTab === 'tafaul',\n      isManhom: s.activeTab === 'manhom',\n      tabStyleMajarra: this.tabStyle('majarra'),\n      tabStyleFann: this.tabStyle('fann'),\n      tabStyleTafaul: this.tabStyle('tafaul'),\n      tabStyleManhom: this.tabStyle('manhom'),\n      setTabMajarra: () => this.setState({ activeTab: 'majarra' }),\n      setTabFann: () => this.setState({ activeTab: 'fann' }),\n      setTabTafaul: () => this.setState({ activeTab: 'tafaul' }),\n      setTabManhom: () => this.setState({ activeTab: 'manhom' }),\n\n      majarraPlanTitle: s.majarraBilling === 'yearly' ? 'اشتراك مجرة السنوي' : 'اشتراك مجرة الشهري',\n      majarraPrice: s.majarraBilling === 'yearly' ? '89,000 ل.س / سنوياً' : '15,000 ل.س / شهرياً',\n      isMajarraYearly: s.majarraBilling === 'yearly',\n      majarraOldPrice: '178,000 ل.س',\n      majarraToggleMonthlyStyle: `border:none;border-radius:8px;padding:10px 18px;font:700 13px 'Cairo';cursor:pointer;background:${s.majarraBilling === 'monthly' ? '#fff' : 'transparent'};color:${s.majarraBilling === 'monthly' ? '#161616' : '#8a8a8a'}`,\n      majarraToggleYearlyStyle: `border:none;border-radius:8px;padding:10px 18px;font:700 13px 'Cairo';cursor:pointer;background:${s.majarraBilling === 'yearly' ? '#161616' : 'transparent'};color:${s.majarraBilling === 'yearly' ? '#fff' : '#8a8a8a'}`,\n      setMajarraMonthly: () => this.setState({ majarraBilling: 'monthly' }),\n      setMajarraYearly: () => this.setState({ majarraBilling: 'yearly' }),\n\n      openMajarraModal: () => this.openModal('اشتراك مجرة', this.state.majarraBilling === 'yearly' ? '89,000 ل.س / سنوياً' : '15,000 ل.س / شهرياً', 'pay'),\n      openFannModal: () => this.openModal('اشتراك فن القيادة', '270,000 ل.س / سنوياً', 'pay'),\n      openTafaulModal: () => this.openModal('اشتراك تفاؤل', '75,000 ل.س / سنوياً', 'pay'),\n      openManhomModalReputation: () => this.openModal('من هم — السمعة الرقمية', '149$ / سنوياً', 'pay'),\n      openManhomModalInfluential: () => this.openModal('من هم — الحضور المؤثر', '300$ / سنوياً', 'pay'),\n      openManhomCeoModal: () => this.openModal('من هم — الرؤساء التنفيذيون', 'حسب الطلب', 'contact'),\n\n      manhomRows,\n\n      modalOpen: s.modalOpen,\n      modalPlanName: s.modalPlan ? s.modalPlan.name : '',\n      modalPlanPrice: s.modalPlan ? s.modalPlan.price : '',\n      modalStepForm: s.modalStep === 'form',\n      modalStepPay: s.modalStep === 'pay' && s.modalMode === 'pay',\n      modalStepContact: s.modalStep === 'pay' && s.modalMode === 'contact',\n      formName: s.formName,\n      formPhone: s.formPhone,\n      formEmail: s.formEmail,\n      formSubmitDisabledStyle: (!s.formName || !s.formPhone) ? 'opacity:.5;pointer-events:none' : '',\n      onNameChange: (e) => this.setState({ formName: e.target.value }),\n      onPhoneChange: (e) => this.setState({ formPhone: e.target.value }),\n      onEmailChange: (e) => this.setState({ formEmail: e.target.value }),\n      submitForm: () => this.setState({ modalStep: 'pay' }),\n      closeModal: () => this.setState({ modalOpen: false }),\n      stopProp: (e) => e.stopPropagation(),\n      whatsappLink: this.buildWhatsappLink(),\n      setManhomVideoRef: (el) => { this.manhomVideoEl = el; },\n      manhomPlayIcon: s.manhomVideoPlaying ? '❙❙' : '▶',\n      manhomMuteIcon: s.manhomVideoMuted ? 'تشغيل الصوت' : 'كتم الصوت',\n      toggleManhomPlay: () => {\n        const v = this.manhomVideoEl;\n        if (!v) return;\n        if (v.paused) { v.play(); this.setState({ manhomVideoPlaying: true }); }\n        else { v.pause(); this.setState({ manhomVideoPlaying: false }); }\n      },\n      toggleManhomMute: () => {\n        const v = this.manhomVideoEl;\n        if (!v) return;\n        v.muted = !v.muted;\n        this.setState({ manhomVideoMuted: v.muted });\n      }\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
</html>
